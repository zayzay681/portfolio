<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zay Zay — Cyber Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0f14;
    --panel: #10161d;
    --panel-header: #161d26;
    --border: #26313d;
    --text: #cbd5df;
    --text-dim: #7c8a99;
    --amber: #e3a857;
    --teal: #4fb8a8;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'IBM Plex Sans', Arial, sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background:
      linear-gradient(180deg, rgba(227,168,87,0.04), transparent 300px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
  }

  a{ color: var(--teal); text-decoration: none; }
  a:hover{ text-decoration: underline; }
  a:focus-visible, button:focus-visible{ outline: 2px solid var(--amber); outline-offset: 3px; }

  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header{
    border-bottom: 1px solid var(--border);
    padding-bottom: 28px;
    margin-bottom: 40px;
  }

  .prompt{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
  }
  .prompt .path{ color: var(--teal); }
  .prompt .cursor{
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--amber);
    margin-left: 4px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  h1{
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(34px, 6vw, 56px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: #f2f5f8;
  }

  .role-line{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    margin-top: 14px;
  }

  .tag{
    font-family: var(--mono);
